<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff" />

    <title>포스트 | 차한음 블로그</title>
    <meta name="description" content="포스트 | 차한음 블로그">
    <meta name="author" content="차한음">
    <link rel="canonical" href="https://chebread.github.io/posts">
    <link rel="alternate" type="application/rss+xml" title="차한음 블로그" href="{{if .IsProduction}}https://chebread.github.io/rss.xml{{else}}/rss.xml{{end}}" />
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">

    <meta property="og:title" content="포스트 | 차한음 블로그">
    <meta property="og:description" content="포스트 | 차한음 블로그">
    <meta property="og:type" content="article">
    <meta property="og:url" content="https://chebread.github.io/posts.html">
    <meta property="og:site_name" content="차한음 블로그">
    <meta property="og:locale" content="ko_KR">
    <meta property="og:image" content="{{if .IsProduction}}https://chebread.github.io/assets/profile.png{{else}}/assets/profile.png{{end}}">
    <meta property="og:image:alt" content="차한음 블로그 프로필 이미지">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="포스트 | 차한음 블로그">
    <meta name="twitter:description" content="차한음 블로그 포스트">
    <meta name="twitter:image" content="{{if .IsProduction}}https://chebread.github.io/assets/profile.png{{else}}/assets/profile.png{{end}}">
    <meta name="twitter:image:alt" content="차한음 블로그 프로필 이미지">

    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "BlogPosting",
        "headline": "포스트 | 차한음 블로그",
        "author": {
            "@type": "Person",
            "name": "차한음"
        },
        "publisher": {
            "@type": "Organization",
            "name": "차한음",
        },
        "description": "포스트 | 차한음 블로그"
    }
    </script>

    <link rel="stylesheet" href="/styles/reset.css" />
    <link rel="stylesheet" href="/styles/layout.css" />
    <link rel="stylesheet" href="/styles/color-palette.css">

    <link rel="stylesheet" href="/styles/posts.css">

    <link rel="icon" href="/favicons/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicons/favicon-32x32.png">
    <link rel="apple-touch-icon" href="/favicons/apple-touch-icon.png">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.17.0/dist/katex.min.css" integrity="sha384-vlBdW0r3AcZO/HboRPznQNowvexd3fY8qHOWkBi5q7KGgqJ+F48+DceybYmrVbmB" crossorigin="anonymous">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.17.0/dist/katex.min.js" integrity="sha384-AtrdNsnxl/75rvBneBVH7DtOvCxSVahR2zWqle1coBKd8DEmLoviqNeJSx64gNAs" crossorigin="anonymous"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.17.0/dist/contrib/auto-render.min.js" integrity="sha384-bjyGPfbij8/NDKJhSGZNP/khQVgtHUE5exjm4Ydllo42FwIgYsdLO2lXGmRBf5Mz" crossorigin="anonymous"
        onload="renderMathInElement(document.body, {
            delimiters: [
                {left: '$$', right: '$$', display: true},
                {left: '\\[', right: '\\]', display: true},
                {left: '$', right: '$', display: false},
                {left: '\\(', right: '\\)', display: false}
            ],
            throwOnError: false
        });">
    </script>
</head>
<body>
    <div class="root">
        <div class="posts">
           <nav class="posts-nav">
                <a href="/" class="{{if eq .CurrentURL "/"}}active{{end}}">
                    <span>홈</span>
                </a>
                <a href="/about{{if not .IsProduction}}.html{{end}}" class="{{if eq .CurrentURL "/about"}}active{{end}}">
                    <span>어바웃</span>
                </a>
                <a href="/posts{{if not .IsProduction}}.html{{end}}" class="{{if eq .CurrentURL "/posts"}}active{{end}}">
                    <span>포스트</span>
                </a>
            </nav>

            <main class="posts-list">
                {{ .PostList }}
            </main>
            <footer class="posts-footer">
                <section>
                    <p>&copy; 2025-2026 Cha Haneum</p>
                </section>
                <section>
                    <a href="https://github.com/chebread">
                        <span>깃허브</span>
                    </a>
                    <a href="mailto:chahaneum@chebread.com">
                        <span>이메일</span>
                    </a>
                    <a href="/rss.xml">
                        <span>RSS</span>
                    </a>
                </section>
            </footer>
        </div>
    </div>

    <script src="/js/main.js"></script>
</body>
</html>
